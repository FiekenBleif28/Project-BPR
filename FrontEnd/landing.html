<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Pilihan</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
      position: relative;
    }

    h2 {
      margin-bottom: 20px;
    }

    .btn-wrapper {
      position: relative;
      margin: 30px 0;
      display: inline-block;
    }

    .btn {
      display: block;
      width: 200px;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      position: relative;
      z-index: 1;
      background: #3490dc;
      transition: transform 0.2s;
    }

    .btn.admin {
      background: #ff5722;
    }

    .btn-wrapper:hover .btn {
      transform: scale(1.05);
    }

    /* ===== ICON ANIMASI PREMIUM ===== */
    .icon-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      display: flex;
      gap: 5px;
    }

    .icon-glow span {
      display: block;
      width: 10px;
      height: 10px;
      background: gold;
      border-radius: 50%;
      opacity: 0.8;
      animation: float 2s infinite ease-in-out;
    }

    .icon-glow span:nth-child(2) {
      animation-delay: 0.3s;
    }
    .icon-glow span:nth-child(3) {
      animation-delay: 0.6s;
    }
    .icon-glow span:nth-child(4) {
      animation-delay: 0.9s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0.6;}
      50% { transform: translateY(-15px) scale(1.2); opacity: 1;}
      100% { transform: translateY(0) scale(1); opacity: 0.6;}
    }

  </style>
</head>

<body>
  <div class="container">
    <h2>Pilih Login</h2>

    <div class="btn-wrapper">
  <a href="index.html" class="btn user">Login User</a>
  <div class="icon-glow">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>


    <div class="btn-wrapper">
      <a href="admin/admin.html" class="btn admin">Login Admin</a>
      <div class="icon-glow">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
</body>
</html>
